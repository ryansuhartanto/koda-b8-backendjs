services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: "${PGUSER}"
      POSTGRES_PASSWORD: "${PGPASSWORD}"
      POSTGRES_DB: "${PGDATABASE}"
    volumes:
      - db:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      retries: 10

  migrate:
    image: ghcr.io/ryansuhartanto/koda-b8-backendjs/tools:${TAG:-latest}
    build:
      context: .
      target: tools
    environment:
      PGHOST: db
      PGUSER: "${PGUSER}"
      PGPASSWORD: "${PGPASSWORD}"
      PGDATABASE: "${PGDATABASE}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  go:
    image: ghcr.io/ryansuhartanto/koda-b8-backendjs/go:${TAG:-latest}
    build:
      context: .
      target: go
    environment:
      PGHOST: db
      PGUSER: "${PGUSER}"
      PGPASSWORD: "${PGPASSWORD}"
      PGDATABASE: "${PGDATABASE}"
      JWT_SECRET: "${JWT_SECRET}"
      SQIDS_ALPHABET: "${SQIDS_ALPHABET}"
      GO_PORT: "${GO_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${GO_PORT}:${GO_PORT}"

  js:
    image: ghcr.io/ryansuhartanto/koda-b8-backendjs/js:${TAG:-latest}
    build:
      context: .
      target: js
    environment:
      PGHOST: db
      PGUSER: "${PGUSER}"
      PGPASSWORD: "${PGPASSWORD}"
      PGDATABASE: "${PGDATABASE}"
      JWT_SECRET: "${JWT_SECRET}"
      SQIDS_ALPHABET: "${SQIDS_ALPHABET}"
      JS_PORT: "${JS_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${JS_PORT}:${JS_PORT}"

volumes:
  db:
