components:
  schemas:
    Address:
      properties:
        address:
          type: string
        city:
          type: string
        id:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        name:
          type: string
        phone:
          type: string
        postal_code:
          type: string
        province:
          type: string
      required:
      - address
      - city
      - id
      - is_default
      - label
      - name
      - phone
      - postal_code
      - province
      type: object
    AddressRequest:
      properties:
        address:
          type: string
        city:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        name:
          type: string
        phone:
          type: string
        postal_code:
          type: string
        province:
          type: string
      required:
      - address
      - city
      - label
      - name
      - phone
      - postal_code
      - province
      type: object
    Brand:
      properties:
        id:
          type: string
        name:
          type: string
        product_count:
          type: integer
      required:
      - id
      - name
      - product_count
      type: object
    Cart:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CartItem'
          type: array
          uniqueItems: false
        subtotal_idr:
          type: integer
      required:
      - items
      - subtotal_idr
      type: object
    CartItem:
      properties:
        created_at:
          type: string
        id_product:
          type: string
        id_variant:
          type: string
        inventory:
          type: integer
        name:
          type: string
        original_price_idr:
          type: integer
        price_idr:
          type: integer
        quantity:
          type: integer
        sku:
          type: string
        urls:
          items:
            type: string
          type: array
          uniqueItems: false
        variant_options:
          items:
            $ref: '#/components/schemas/VariantOption'
          type: array
          uniqueItems: false
      required:
      - created_at
      - id_product
      - id_variant
      - inventory
      - name
      - original_price_idr
      - price_idr
      - quantity
      type: object
    CartRequest:
      properties:
        id_variant:
          type: string
        quantity:
          minimum: 1
          type: integer
      required:
      - id_variant
      - quantity
      type: object
    Category:
      properties:
        icon:
          type: string
        id:
          type: string
        img:
          type: string
        name:
          type: string
        product_count:
          type: integer
      required:
      - id
      - name
      - product_count
      type: object
    LoginRequest:
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
      type: object
    Order:
      properties:
        created_at:
          type: string
        discount_idr:
          type: integer
        id:
          type: string
        id_payment:
          type: string
        items:
          items:
            $ref: '#/components/schemas/OrderItem'
          type: array
          uniqueItems: false
        promo_code:
          type: string
        ship_address:
          type: string
        ship_cost_idr:
          type: integer
        ship_email:
          type: string
        ship_method:
          type: string
        ship_name:
          type: string
        ship_note:
          type: string
        ship_phone:
          type: string
        status:
          enum:
          - pending
          - packed
          - shipped
          - delivered
          - cancelled
          type: string
        subtotal_idr:
          type: integer
        total_idr:
          type: integer
      required:
      - created_at
      - discount_idr
      - id
      - id_payment
      - items
      - ship_address
      - ship_cost_idr
      - ship_email
      - ship_method
      - ship_name
      - ship_phone
      - status
      - subtotal_idr
      - total_idr
      type: object
    OrderItem:
      properties:
        id:
          type: string
        id_variant:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
        unit_price_idr:
          type: integer
        variant_name:
          type: string
      required:
      - id
      - product_name
      - quantity
      - unit_price_idr
      type: object
    OrderRequest:
      properties:
        id_address:
          type: string
        id_payment:
          type: string
        promo_code:
          type: string
        ship_method:
          type: string
        ship_note:
          type: string
      required:
      - id_address
      - id_payment
      - ship_method
      type: object
    OrderStatusRequest:
      properties:
        status:
          enum:
          - pending
          - packed
          - shipped
          - delivered
          - cancelled
          type: string
      required:
      - status
      type: object
    PaymentMethod:
      properties:
        id:
          type: string
        metadata:
          type: object
        name:
          type: string
      required:
      - id
      - metadata
      - name
      type: object
    Problem:
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
      required:
      - status
      - title
      type: object
    Product:
      properties:
        brand:
          type: string
        category:
          type: string
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        original_price_idr:
          type: integer
        price_idr:
          type: integer
        rating:
          type: number
        rating_count:
          type: integer
        stock:
          type: integer
        updated_at:
          type: string
        urls:
          items:
            type: string
          type: array
          uniqueItems: false
        variants:
          items:
            $ref: '#/components/schemas/ProductVariant'
          type: array
          uniqueItems: false
      required:
      - created_at
      - id
      - name
      - rating_count
      - stock
      - updated_at
      type: object
    ProductRequest:
      properties:
        description:
          type: string
        discount_price_idr:
          type: integer
        id_brand:
          type: string
        id_category:
          type: string
        name:
          type: string
        original_price_idr:
          type: integer
        sku:
          type: string
        stock:
          type: integer
        urls:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - name
      - original_price_idr
      type: object
    ProductVariant:
      properties:
        id:
          type: string
        options:
          items:
            $ref: '#/components/schemas/VariantOption'
          type: array
          uniqueItems: false
        original_price_idr:
          type: integer
        price_idr:
          type: integer
        sku:
          type: string
        stock:
          type: integer
      required:
      - id
      - options
      - original_price_idr
      - price_idr
      - stock
      type: object
    RegisterRequest:
      properties:
        email:
          type: string
        name:
          type: string
        password:
          minLength: 8
          type: string
      required:
      - email
      - name
      - password
      type: object
    ShippingMethod:
      properties:
        cost_idr:
          type: integer
        id:
          type: string
        name:
          type: string
      required:
      - cost_idr
      - id
      - name
      type: object
    TokenResponse:
      properties:
        token:
          type: string
      required:
      - token
      type: object
    User:
      properties:
        avatar:
          type: string
        birthdate:
          type: string
        created_at:
          type: string
        email:
          type: string
        gender:
          type: string
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        roles:
          items:
            type: string
          type: array
          uniqueItems: false
        updated_at:
          type: string
      required:
      - created_at
      - email
      - id
      - roles
      - updated_at
      type: object
    UserPayment:
      properties:
        created_at:
          type: string
        data:
          type: object
        id:
          type: string
        id_payment:
          type: string
        is_default:
          type: boolean
        type:
          type: string
      required:
      - created_at
      - data
      - id
      - id_payment
      - is_default
      - type
      type: object
    VariantOption:
      properties:
        option:
          type: string
        value:
          type: string
      required:
      - option
      - value
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: suhartanto@kekkon.nexus
    name: Ryan Suhartanto
    url: https://github.com/ryansuhartanto/koda-b8-backend
  description: E-commerce API for the BeliMudah storefront.
  license:
    name: MIT
  title: BeliMudah API
  version: "1.0"
openapi: 3.1.0
paths:
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
              description: Credentials
              summary: body
        description: Credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: Authenticate
      tags:
      - auth
  /auth/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
              description: Credentials
              summary: body
        description: Credentials
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Email already registered
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: Register
      tags:
      - auth
  /brands:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Brand'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: List brands
      tags:
      - catalog
  /categories:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Category'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: List categories
      tags:
      - catalog
  /healthz:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Database unreachable
      summary: Check liveness
      tags:
      - meta
  /me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such user
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Fetch the profile
      tags:
      - me
  /me/addresses:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Address'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: List addresses
      tags:
      - addresses
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
              description: Address
              summary: body
        description: Address
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Add an address
      tags:
      - addresses
  /me/cart:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Fetch the cart
      tags:
      - cart
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
              description: Line
              summary: body
        description: Line
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such variant
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Set a cart line quantity
      tags:
      - cart
  /me/cart/{id_variant}:
    delete:
      parameters:
      - description: Variant sqid
        in: path
        name: id_variant
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such cart item
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Remove a cart line
      tags:
      - cart
  /me/orders:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Order'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: List own orders
      tags:
      - orders
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
              description: Checkout
              summary: body
        description: Checkout
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such address, payment method or shipping method
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Empty cart or insufficient stock
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Check out
      tags:
      - orders
  /me/payments:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserPayment'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: List saved payment methods
      tags:
      - me
  /orders:
    get:
      parameters:
      - description: Order status
        in: query
        name: status
        schema:
          enum:
          - pending
          - packed
          - shipped
          - delivered
          - cancelled
          type: string
      - description: Rows to return, 1 to 100
        in: query
        name: limit
        schema:
          default: 20
          type: integer
      - description: Rows to skip
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Order'
                type: array
          description: OK
          headers:
            Link:
              description: RFC 8288 pagination links
              schema:
                type: string
            X-Total-Count:
              description: Rows matching the filter, ignoring limit and offset
              schema:
                type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid query
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not an admin
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - orders
  /orders/{id_order}:
    patch:
      parameters:
      - description: Order sqid
        in: path
        name: id_order
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusRequest'
              description: Status
              summary: body
        description: Status
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not an admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such order
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Disallowed transition
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Update order status
      tags:
      - orders
  /payment-methods:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaymentMethod'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: List payment methods
      tags:
      - catalog
  /products:
    get:
      parameters:
      - description: Product name substring
        in: query
        name: search
        schema:
          type: string
      - description: Category name
        in: query
        name: category
        schema:
          type: string
      - description: Brand name
        in: query
        name: brand
        schema:
          type: string
      - description: Sort order
        in: query
        name: sort
        schema:
          enum:
          - newest
          - price_asc
          - price_desc
          - rating
          type: string
      - description: Rows to return, 1 to 100
        in: query
        name: limit
        schema:
          default: 20
          type: integer
      - description: Rows to skip
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Product'
                type: array
          description: OK
          headers:
            Link:
              description: RFC 8288 pagination links
              schema:
                type: string
            X-Total-Count:
              description: Rows matching the filter, ignoring limit and offset
              schema:
                type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid query
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: List products
      tags:
      - products
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
              description: Product
              summary: body
        description: Product
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not an admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such category or brand
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
