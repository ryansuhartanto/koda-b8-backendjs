components:
  schemas:
    Address:
      properties:
        address:
          type: string
        city:
          type: string
        id:
          type: integer
        is_default:
          type: boolean
        label:
          type: string
        name:
          type: string
        phone:
          type: string
        postal_code:
          type: string
        province:
          type: string
      required:
      - address
      - city
      - id
      - is_default
      - label
      - name
      - phone
      - postal_code
      - province
      type: object
    AddressRequest:
      properties:
        address:
          type: string
        city:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        name:
          type: string
        phone:
          type: string
        postal_code:
          type: string
        province:
          type: string
      required:
      - address
      - city
      - label
      - name
      - phone
      - postal_code
      - province
      type: object
    CartItem:
      properties:
        id_variant:
          type: string
        img_alt:
          type: string
        img_url:
          type: string
        name:
          type: string
        name_variant:
          type: string
        original_price_idr:
          type: integer
        path:
          type: string
        price_idr:
          type: integer
        quantity:
          type: integer
      required:
      - id_variant
      - img_alt
      - img_url
      - name
      - name_variant
      - original_price_idr
      - path
      - price_idr
      - quantity
      type: object
    CartRequest:
      properties:
        id_variant:
          type: string
        quantity:
          minimum: 1
          type: integer
      required:
      - id_variant
      - quantity
      type: object
    LoginRequest:
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
      type: object
    Order:
      properties:
        created_at:
          type: string
        discount_idr:
          type: integer
        id:
          type: integer
        items:
          items:
            $ref: '#/components/schemas/OrderItem'
          type: array
          uniqueItems: false
        payment_method:
          type: string
        promo_code:
          type: string
        ship_address:
          type: string
        ship_cost_idr:
          type: integer
        ship_email:
          type: string
        ship_method:
          type: string
        ship_name:
          type: string
        ship_note:
          type: string
        ship_phone:
          type: string
        status:
          type: string
        subtotal_idr:
          type: integer
        total_idr:
          type: integer
      required:
      - created_at
      - discount_idr
      - id
      - items
      - payment_method
      - promo_code
      - ship_address
      - ship_cost_idr
      - ship_email
      - ship_method
      - ship_name
      - ship_note
      - ship_phone
      - status
      - subtotal_idr
      - total_idr
      type: object
    OrderItem:
      properties:
        id:
          type: integer
        id_variant:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
        unit_price_idr:
          type: integer
        variant_name:
          type: string
      required:
      - id
      - product_name
      - quantity
      - unit_price_idr
      - variant_name
      type: object
    OrderRequest:
      properties:
        id_address:
          type: integer
        payment_method:
          type: string
        promo_code:
          type: string
        ship_method:
          type: string
        ship_note:
          type: string
      required:
      - id_address
      - payment_method
      - ship_method
      type: object
    Problem:
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
      required:
      - status
      - title
      type: object
    Product:
      properties:
        brand:
          type: string
        category:
          type: string
        description:
          type: string
        id:
          type: string
        img_url:
          type: string
        inventory:
          type: integer
        name:
          type: string
        original_price_idr:
          type: integer
        path:
          type: string
        price_idr:
          type: integer
        rating:
          type: number
        rating_count:
          type: integer
        variants:
          items:
            $ref: '#/components/schemas/ProductVariant'
          type: array
          uniqueItems: false
      required:
      - brand
      - category
      - id
      - img_url
      - inventory
      - name
      - original_price_idr
      - path
      - price_idr
      - rating
      - rating_count
      type: object
    ProductVariant:
      properties:
        description:
          type: string
        id:
          type: string
        inventory:
          type: integer
        name:
          type: string
        original_price_idr:
          type: integer
        price_idr:
          type: integer
      required:
      - id
      - inventory
      - name
      - original_price_idr
      - price_idr
      type: object
    RegisterRequest:
      properties:
        email:
          type: string
        name:
          type: string
        password:
          minLength: 8
          type: string
      required:
      - email
      - name
      - password
      type: object
    ShippingMethod:
      properties:
        cost_idr:
          type: integer
        id:
          type: integer
        name:
          type: string
      required:
      - cost_idr
      - id
      - name
      type: object
    TokenResponse:
      properties:
        token:
          type: string
      required:
      - token
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: suhartanto@kekkon.nexus
    name: Ryan Suhartanto
    url: https://github.com/ryansuhartanto/koda-b8-backend
  description: E-commerce API for the BeliMudah storefront.
  license:
    name: MIT
  title: BeliMudah API
  version: "1.0"
openapi: 3.1.0
paths:
  /addresses:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Address'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: List the caller's addresses, default first
      tags:
      - addresses
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
              description: Address
              summary: body
        description: Address
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Add an address to the caller's account
      tags:
      - addresses
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
              description: Credentials
              summary: body
        description: Credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: Exchange credentials for a token
      tags:
      - auth
  /auth/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
              description: Credentials
              summary: body
        description: Credentials
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Email already registered
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: Register an account
      tags:
      - auth
  /cart:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CartItem'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: List the caller's cart
      tags:
      - cart
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
              description: Line
              summary: body
        description: Line
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid token
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such variant
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Set the quantity of one cart line
      tags:
      - cart
  /cart/{id_variant}:
    delete:
      parameters:
      - description: Variant sqid
        in: path
        name: id_variant
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Remove one variant from the cart
      tags:
      - cart
  /healthz:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Database unreachable
      summary: Liveness and database reachability
      tags:
      - meta
  /orders:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Order'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: List the caller's orders, newest first
      tags:
      - orders
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
              description: Checkout
              summary: body
        description: Checkout
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Missing or invalid token
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such address or shipping method
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Empty cart or insufficient stock
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      security:
      - BearerAuth: []
      summary: Turn the caller's cart into an order
      tags:
      - orders
  /products:
    get:
      parameters:
      - description: Match against the product name
        in: query
        name: search
        schema:
          type: string
      - description: Category name
        in: query
        name: category
        schema:
          type: string
      - description: Brand name
        in: query
        name: brand
        schema:
          type: string
      - description: One of newest, price_asc, price_desc, rating
        in: query
        name: sort
        schema:
          enum:
          - newest
          - price_asc
          - price_desc
          - rating
          type: string
      - description: Rows to return, 1 to 100
        in: query
        name: limit
        schema:
          default: 20
          type: integer
      - description: Rows to skip
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Product'
                type: array
          description: OK
          headers:
            Link:
              description: 'RFC 8288 pagination links: self, first, last, prev, next'
              schema:
                type: string
            X-Total-Count:
              description: Rows matching the filter, ignoring limit and offset
              schema:
                type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid query
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: List products
      tags:
      - products
  /products/{sqid}/{slug}:
    get:
      parameters:
      - description: Product sqid
        in: path
        name: sqid
        required: true
        schema:
          type: string
      - description: Decorative slug, ignored when resolving and corrected by redirect
        in: path
        name: slug
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: OK
        "302":
          content:
            application/json:
              schema:
                type: string
          description: Slug is absent or stale
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such product
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: Fetch one product
      tags:
      - products
  /shipping-methods:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ShippingMethod'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: List shipping methods and their cost
      tags:
      - shipping
servers:
- url: http://localhost:3001
