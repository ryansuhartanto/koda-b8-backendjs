[tools]
go = "1.26.5"
node = "26"
aube = "latest"
"go:github.com/golang-migrate/migrate/v4/cmd/migrate" = { version = "latest", tags = "pgx5" }
usql = "latest"

[env]
_.file = { path = ".env", redact = false }

[tasks.dev]
run = "mise run dev:go ::: dev:js"

[tasks."dev:go"]
dir = "apps/go"
run = "go tool air"

[tasks."dev:js"]
run = "aubx vp run -r --parallel dev"

[tasks.check]
run = "mise run check:go ::: check:js"

[tasks."check:go"]
dir = "apps/go"
run = "go vet ./..."

[tasks."check:js"]
run = "aubx vp check"

[tasks.test]
run = "mise run test:go ::: test:js ::: test:parity:live"

[tasks."test:go"]
dir = "apps/go"
run = "go tool gotestsum -- ./..."

[tasks."test:js"]
run = "aubx vp test run apps/js"

[tasks."test:parity"]
run = "aubx vp test run parity"

[tasks."test:watch"]
run = "mise run test:watch:go ::: test:watch:js"

[tasks."test:watch:go"]
dir = "apps/go"
run = "go tool gotestsum --watch"

[tasks."test:watch:js"]
run = "aubx vp test"

[tasks.pack]
run = "mise run pack:js ::: pack:seed"

[tasks."pack:js"]
run = "aube --dir apps/js run pack"

[tasks."pack:seed"]
run = "aube --dir db/seed run pack"

[tasks.docs]
run = "mise run docs:events ::: docs:go ::: docs:js"

[tasks."docs:events"]
run = """
cp db/asyncapi.yaml apps/go/docs/asyncapi.yaml
cp db/asyncapi.yaml apps/js/docs/asyncapi.yaml
"""

[tasks."docs:go"]
dir = "apps/go"
run = "go tool swag init --v3.1"

[tasks."docs:js"]
run = "aube --dir apps/js run docs"

[tasks."db:create"]
usage = 'arg "<name>"'
run = "migrate create -ext sql -dir db/migrations -seq {{usage.name}}"

[tasks.db]
run = "migrate -database pgx5://: -path db/migrations"

[tasks."db:seed"]
run = "aube --dir db/seed run start"

[tasks."db:up"]
run = "mise run db up"

[tasks."db:down"]
run = "mise run db down"
