name: CI

on:
  push:

jobs:
  check:
    name: Check

    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
    env:
      GOTESTSUM_FORMAT: github-actions
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ecommerce
      GO_PORT: 3001
      JS_PORT: 3002
      JWT_SECRET: ci-test
      SQIDS_ALPHABET: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
    services:
      db:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('apps/go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('apps/go/go.sum') }}-
            go-

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/go/go.mod

      - run: bun ci
      - run: go -C apps/go mod tidy -diff

      - run: go install -tags pgx5 github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - run: bun run check

      - name: Migrate and seed
        run: |
          bun run db:up
          bun run db:seed

      - name: Test
        run: bun run test

      - name: Roll back
        run: bun run db down -all

      - name: Check specs are current
        run: |
          bun run docs
          git diff --exit-code

  release:
    name: Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: tools
        with:
          images: ghcr.io/${{ github.repository }}/tools
          bake-target: tools-meta
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/metadata-action@v6
        id: go
        with:
          images: ghcr.io/${{ github.repository }}/go
          bake-target: go-meta
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/metadata-action@v6
        id: js
        with:
          images: ghcr.io/${{ github.repository }}/js
          bake-target: js-meta
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.tools.outputs.bake-file }}
            cwd://${{ steps.go.outputs.bake-file }}
            cwd://${{ steps.js.outputs.bake-file }}
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
